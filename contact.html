  <body>

      <h1>contact me.</h1>
      <form
        action="https://formspree.io/f/xpwwgnvq"
        method="POST"
        class="mx-auto"
        style="max-width: 800px"
      >
        <div class="row g-3">
          <div class="col-md-6">
            <label for="fname" class="form-label">First name:</label>
            <input
              type="text"
              class="form-control"
              name="fname"
              id="fname"
              placeholder="first name."
              required
            />
          </div>
          <div class="col-md-6">
            <label for="lname" class="form-label">Last name:</label>
            <input
              type="text"
              class="form-control"
              name="lname"
              id="lname"
              placeholder="last name."
              required
            />
          </div>
        </div>
        <div class="form-group mt-3">
          <label for="email">Email:</label>
          <input
            type="email"
            class="form-control"
            name="email"
            id="email"
            placeholder="abc@123.com"
            required
          />
        </div>
        <div class="form-group mt-3">
          <label for="msg">Message:</label>
          <textarea
            name="message"
            class="form-control"
            id="msg"
            rows="10"
            placeholder="hey! ..."
          ></textarea>
        </div>
        <div class="form-group mt-3 text-center">
          <div class="row">
            <div class="col-auto">
              <div class="form-check d-inline-block">
                <input
                  type="checkbox"
                  class="form-check-input"
                  id="subscribe"
                  name="subscribe"
                  checked
                />
                <label class="form-check-label" for="subscribe"
                  >Subscribe to blog?</label
                >
              </div>
            </div>
          </div>
        </div>
        <div class="text-center mt-4">
          <button type="submit" class="btn btn-primary">Submit</button>
        </div>
      </form>

      <footer>
        <div class="container">
          <div class="row align-items-center">
            <div class="col-sm-4"></div>
            <div class="col-sm-2">
              <a href="https://bsky.app/profile/matt-skokos.bsky.social"
                >Blue Sky</a
              >
            </div>
            <div class="col-sm-2">
              <a href="https://www.linkedin.com/in/matt-skokos/">LinkedIn</a>
            </div>
            <div class="col-sm-2">
              <a href="https://github.com/matt-skokos">GitHub</a>
            </div>
            <div class="col-sm-4"></div>
          </div>
